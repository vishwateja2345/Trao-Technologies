services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # set to your deployed frontend URL, e.g. https://your-app.vercel.app
      - key: MONGODB_URI
        sync: false # MongoDB Atlas free-tier connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_PROVIDER
        value: deepseek # or "openrouter" — see server/.env.example for both options
      - key: DEEPSEEK_API_KEY
        sync: false # your own DeepSeek key — never committed
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: OPENROUTER_API_KEY
        sync: false # only used if LLM_PROVIDER=openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
