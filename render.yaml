services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # set to your deployed frontend URL, e.g. https://your-app.vercel.app
      - key: MONGODB_URI
        sync: false # MongoDB Atlas free-tier connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false # your own free-tier OpenRouter key — never committed
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: ALLOW_PRIVATE_HOSTS
        value: "false"
